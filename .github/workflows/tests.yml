name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  unit:
    # The unit tests use fake adapters and need no Mac, microphone or model.
    # Anything that needs MLX, Quartz or PortAudio skips itself on Linux.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ".[dev,refine]"
      - run: pytest -q
