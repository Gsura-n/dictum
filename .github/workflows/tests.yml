name: tests

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:

jobs:
  unit:
    # The unit tests use fake adapters and need no Mac, microphone or model.
    # Anything that needs MLX, Quartz or PortAudio skips itself on Linux.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install and test
        run: |
          set -o pipefail
          { pip install ".[dev,refine]" && pytest -q -rfE; } 2>&1 | tee /tmp/ci.log
      - name: Report failure output
        # Puts the end of the log in an annotation so it shows on the PR and in the checks API
        if: failure()
        run: |
          tail -n 60 /tmp/ci.log | python3 -c "import sys; t=sys.stdin.read().replace('%','%25').replace('\r','%0D').replace('\n','%0A'); print('::error title=install and test output::' + t)"
