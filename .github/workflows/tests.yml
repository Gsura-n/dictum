name: tests

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:

jobs:
  unit:
    # The unit tests use fake adapters and need no Mac, microphone or model.
    # Anything that needs MLX, Quartz or PortAudio skips itself on Linux.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ".[dev,refine]"
      - run: pytest -q
